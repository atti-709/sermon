[project]
name = "sermon"
version = "0.1.0"
description = "Transcribe Slovak sermon videos locally (mlx-whisper, Apple GPU) and pick social-media highlights with Gemini"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4",
    "google-genai>=1.0",
    "pydantic>=2",
    "whisperx>=3.8.6",
]

[project.scripts]
sermon = "sermon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sermon"]
